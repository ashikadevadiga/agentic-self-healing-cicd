name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: application
        shell: bash
        run: |
          mvn test 2>&1 | tee test-results.log
          exit ${PIPESTATUS[0]}

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-log
          path: application/test-results.log